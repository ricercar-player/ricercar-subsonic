# Entry for the ricercar plugin hub (github.com/ricercar-player/ricercar-plugins),
# to publish as plugins/subsonic.toml. On a release, update `version`, the
# URLs and the SHA-256 from the release's .sha256 files.
id = "subsonic"
name = "Subsonic"
description = "Browse, search and play the music of your own Subsonic-compatible server: Navidrome, Gonic, Airsonic-Advanced, LMS, Ampache. Albums, artists, playlists and starred items, merged into your library, and Home shelves of recent, most played and random albums. Original files, bit for bit; FLAC at a rate your DAC takes when the server can transcode (Navidrome 0.64+)."
author = "ricercar-player"
license = "MIT"
repository = "https://github.com/ricercar-player/ricercar-subsonic"
version = "0.3.0"
protocol = 1
capabilities = ["auth", "browse", "search", "resolve", "favorites", "reporting", "library", "lyrics", "details", "radio", "playlist_edit"]

[[assets]]
arch = "x86_64"
url = "https://github.com/ricercar-player/ricercar-subsonic/releases/download/v0.3.0/subsonic-x86_64"
sha256 = "8a290ac7781579f7e21f30e915bff4e734ba2bd4266c8a42738de9c176148f83"

[[assets]]
arch = "aarch64"
